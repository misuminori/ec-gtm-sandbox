  <nav class="breadcrumb">

  </nav>

<!-- ページ別ロジックはこの下に1つの<script>で書く -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1) 検索語は URL の ?q= から取る（ヘッダーの検索バーが GET で飛ばしてくる）
  var q = (window.App.getParam('q') || '').trim();

  // 2) 検索（商品名 / カテゴリ / 説明文の部分一致）
  var items = q ? window.DATA.search(q) : [];

  // 3) タイトル / 件数
  document.querySelector('[data-page-title]').textContent = q ? '「' + q + '」の検索結果' : '検索結果';
  document.querySelector('[data-page-lead]').textContent = q ? items.length + '件の商品' : 'キーワードを入力してください';

  // 4) 計測: search（0件でも送る＝「何を探して見つからなかったか」が分析価値になる）
  //    ※ GA4 の拡張計測「サイト内検索」も ?q= を見て view_search_results を自動送信する。
  //      2本並ぶのは意図的で、どちらを正にするかを GTM/GA4 側で決める（教材の論点）。
  if (q) window.DL.search(q, items.length);

  // 5) グリッド描画（view_item_list + 各カードに select_item を仕込む）。0件は文言だけ。
  var grid = document.getElementById('grid');
  if (items.length) {
    window.App.renderProductGrid(grid, items, 'search_results', '検索結果');
  } else {
    grid.innerHTML = '<p class="search-empty">' +
      (q ? '該当する商品が見つかりませんでした。別のキーワードでお試しください。' : 'ヘッダーの検索アイコンからキーワードを入力してください。') +
      '</p>';
  }
});
</script>
</body>
</html>
